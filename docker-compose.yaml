services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - 5432:5432
    volumes:
      - db_volume:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Kafka's internal topics default to a replication factor of 3 (one
      # copy per broker, for production fault tolerance) - impossible to
      # satisfy with exactly one broker. Without these, Kafka silently
      # retries creating __consumer_offsets (where committed consumer-group
      # offsets actually live) forever, and every operation that touches a
      # consumer group - joining one, committing an offset, even `describe`
      # from the CLI - hangs or times out with no clear error pointing here.
      # See STUDY_NOTES.md §20 for how this was actually diagnosed.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_volume:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      # Dev-only default credentials (admin/admin) - fine for a local
      # learning project, never for anything reachable outside localhost.
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_volume:/var/lib/grafana
      # Provisioning: the datasource and dashboards are defined as files in
      # this repo rather than clicked into the UI, so they survive container
      # recreation and are reviewable in version control. See
      # STUDY_NOTES.md §31.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  db_volume:
  prometheus_volume:
  grafana_volume: